[project]
name = "offload-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "strands-agents[anthropic]>=1.55.1",
    "strands-agents-tools>=0.8.8",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offload"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
